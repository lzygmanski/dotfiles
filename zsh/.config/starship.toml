add_newline = false

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "git "

[git_status]
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 1000
format = "took [$duration]($style) "

[nodejs]
symbol = "node "

[python]
symbol = "py "

[ruby]
symbol = "rb "

[golang]
symbol = "go "

[aws]
disabled = false
