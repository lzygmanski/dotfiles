[appearance]
spacing = "compact"

[appearance.themes]
system_theme = false
theme = { custom = { name = "Dotfiles Dracula", path = "~/.warp/themes/dotfiles-dracula.yaml" } }

[appearance.text]
enforce_minimum_contrast = "never"
notebook_font_size = 15.0
font_size = 15.0

[appearance.window]
override_opacity = 47
override_blur = 18
override_blur_texture = true
zoom_level = 100

[appearance.vertical_tabs]
enabled = false

[code]

[code.editor]
show_code_review_button = true
show_project_explorer = false
show_global_search = false

[warp_drive]
enabled = false

[agents]

[agents.third_party]
should_render_cli_agent_toolbar = true
auto_open_composer_on_cli_agent_start = true

[agents.warp_agent]
is_any_ai_enabled = false

[agents.warp_agent.other]
show_agent_notifications = true

[text_editing]
vim_mode_enabled = true

[notifications]
toast_duration_secs = 8

[notifications.preferences]
is_agent_task_completed_enabled = true
is_long_running_enabled = true
is_needs_attention_enabled = true
is_password_prompt_enabled = true
long_running_threshold = 30
mode = "dismissed"
play_notification_sound = true

[terminal]
osc52_clipboard_access = "write_only"
